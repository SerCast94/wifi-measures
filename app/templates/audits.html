{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Auditorías</h2>
  <div>
    <button id="syncAudits" class="btn btn-outline-primary">Sincronizar</button>
  </div>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Fecha</th>
      <th>Técnico</th>
      <th>Equipo</th>
      <th>Tipo</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="auditsBody">
  </tbody>
</table>

<div class="d-flex justify-content-between align-items-center my-3">
  <div>
    <button id="prevPage" class="btn btn-sm btn-outline-secondary">Anterior</button>
    <button id="nextPage" class="btn btn-sm btn-outline-secondary">Siguiente</button>
  </div>
  <div> Página <span id="pageNumber">1</span> </div>
  <div class="w-auto">
    <select id="pageSize" class="form-select form-select-sm">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
    </select>
  </div>
</div>

<!-- Detail modal -->
<div class="modal fade" id="auditModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle de auditoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <pre id="auditDetailPre" style="white-space: pre-wrap;"></pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button id="modalGeneratePdf" type="button" class="btn btn-primary">Generar PDF</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
